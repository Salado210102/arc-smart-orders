name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  foundry:
    name: forge test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge version
        run: forge --version

      - name: Build
        run: |
          set +e
          forge build --sizes 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error title=forge build failed::$(grep -iE 'error' build.log | head -n 6 | tr '\n' ' ' | cut -c1-950)"
          fi
          exit $code

      - name: Tests
        run: |
          set +e
          forge test -vv 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error title=forge test failed::$(grep -iE 'error|FAIL' test.log | head -n 6 | tr '\n' ' ' | cut -c1-950)"
          fi
          exit $code

      - name: AgentCreditPool tests (verbose)
        run: forge test --match-contract AgentCreditPoolTest -vvv

      - name: RevenueRouter integration tests (verbose)
        run: forge test --match-contract RevenueRouterTest -vvv

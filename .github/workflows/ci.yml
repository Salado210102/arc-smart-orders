name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  foundry:
    name: forge test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge version
        run: forge --version

      - name: Build
        run: |
          set +e
          forge build --sizes 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error title=build HEAD::$(head -c 900 build.log | tr '\n' ' ')"
            echo "::error title=build TAIL::$(tail -c 900 build.log | tr '\n' ' ')"
          fi
          exit $code

      - name: Tests
        run: |
          set +e
          forge test -vv 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error title=forge test failed::$(tail -c 950 test.log | tr '\n' ' ')"
          fi
          exit $code

      - name: AgentCreditPool tests (verbose)
        run: forge test --match-contract AgentCreditPoolTest -vvv

      - name: RevenueRouter integration tests (verbose)
        run: forge test --match-contract RevenueRouterTest -vvv

      - name: CrossChainOrderExecutor tests (verbose)
        run: forge test --match-contract CrossChainOrderExecutorTest -vvv

  python:
    name: python (sdk + gex backtest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install eth-account
      - name: SDK signing tests
        run: python sdk/python/tests/test_signing.py
      - name: GEX backtest
        run: python scripts/backtest_gex_signals.py --steps 300 --seed 7

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  foundry:
    name: forge test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge version
        run: forge --version

      - name: Build
        run: forge build --sizes

      - name: Core + Phase 2 tests
        run: forge test -vv

      - name: AgentCreditPool tests (verbose)
        run: forge test --match-contract AgentCreditPoolTest -vvv

      - name: RevenueRouter integration tests (verbose)
        run: forge test --match-contract RevenueRouterTest -vvv

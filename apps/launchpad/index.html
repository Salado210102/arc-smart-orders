<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Launchpad — Arc</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0b0f14; color: #e6edf3; margin: 0; }
      .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
      h1 { font-size: 22px; } h2 { font-size: 16px; }
      .tabs button { margin-right: 8px; }
      button { background: #1f6feb; color: #fff; border: 0; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
      button.sec { background: #2d333b; }
      input, select { background: #161b22; color: #e6edf3; border: 1px solid #30363d; padding: 8px; border-radius: 8px; width: 100%; box-sizing: border-box; margin: 4px 0; }
      .card { background: #11161d; border: 1px solid #232a31; border-radius: 12px; padding: 14px; margin: 10px 0; }
      .muted { color: #8b949e; font-size: 13px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      code { color: #79c0ff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
